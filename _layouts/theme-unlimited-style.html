<style>
  header {
    display: none;
  }
</style>

<body>
  <!-- Theme unlimited -->
  <input type="radio" class="theme-switch" name="theme-switch" id="theme-switch1">
  <label for="theme-switch1" class="switch-label">Light</label>
  <input type="radio" class="theme-switch" name="theme-switch" id="theme-switch2">
  <label for="theme-switch2" class="switch-label">Dark</label>
  <input type="radio" class="theme-switch" name="theme-switch" id="theme-switch3">
  <label for="theme-switch3" class="switch-label">Tomato</label>
  <input type="radio" class="theme-switch" name="theme-switch" id="theme-switch4">
  <label for="theme-switch4" class="switch-label">4</label>
  <input type="radio" class="theme-switch" name="theme-switch" id="theme-switch5">
  <label for="theme-switch5" class="switch-label">5</label>

  <input type="checkbox" class="theme-switch" id="theme-switch" />

  <div id="page">
    <header>
      <nav class="navbar bg-body-tertiary fixed-top">
        <div class="container-fluid">
          <a class="navbar-brand" href="./">{{ site.title }}</a>

            <label for="theme-switch" class="switch-label"></label>

          <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Mobile menu -->
          <div class="mobile-menu">
            <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
              <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Offcanvas</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
              </div>
              <div class="offcanvas-body">
                <div class="menu-mobile">
                  {% include menu.html %}
                </div>
              </div>
            </div>
          </div>

        </div>
      </nav>
    </header>

    <div class="menu-desktop">
      <!-- Theme switcher -->
      <label for="theme-switch" class="switch-label"></label>
      {% include menu.html %}
    </div>


<div class="flex-container">
  <div class="content">

    <div class="hero-block">
      <div class="container">
        <h1 class="display-1">{{ page.title }}</h1>
        <h3>{{ page.excerpt }}</h3>
      </div>
    </div>

    <div class="container">
      {{ content }}
    </div>

    {% include footer.html %}
  </div>
</div>
