<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backbeat.systems — Glyph Field / BACKBEAT</title>
    <style>
        @font-face {
            font-family: 'SFMono';
            src: url('/Users/robcleaton/Library/Fonts/SF-Mono-Semibold.otf') format('opentype');
            font-weight: 600;
        }
        @font-face {
            font-family: 'Tusker';
            src: url('/Users/robcleaton/Library/Fonts/TuskerGrotesk-7700Bold.otf') format('opentype');
            font-weight: 700;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        * { -webkit-font-smoothing: antialiased; }

        html, body { height: 100%; }

        body {
            background: #CE1FE0;
            min-height: 100svh;
            overflow: hidden;
        }

        #field {
            position: fixed;
            inset: 0;
            font-family: 'SFMono', ui-monospace, Menlo, monospace;
            font-weight: 600;
            font-size: 13px;
            line-height: 1;
            letter-spacing: 0;
            white-space: pre;
            color: rgba(255,255,255,0.92);
            user-select: none;
            overflow: hidden;
        }

        #probe {
            position: absolute;
            visibility: hidden;
            white-space: pre;
            font-family: 'SFMono', ui-monospace, Menlo, monospace;
            font-weight: 600;
            font-size: 13px;
            line-height: 1;
        }
    </style>
</head>
<body>

    <pre id="field"></pre>
    <span id="probe">0</span>

    <script>
        (function () {
            var el = document.getElementById('field');
            var probe = document.getElementById('probe');
            var RAMP = ' .:-=+*#%@';
            var LOOP_SECONDS = 22; // the whole ambient field tiles perfectly back to its start every N seconds
            var W = (Math.PI * 2) / LOOP_SECONDS;
            var CHAR_ASPECT = 0.56; // approx monospace glyph width / height, used when rasterizing the wordmark

            var cols = 0, rows = 0, cx = 0, cy = 0;
            var charW = 8, charH = 13;
            var mask = null; // Float32Array(cols*rows), 0..1 density of the "BACKBEAT" wordmark
            var resizeTimer = null;

            // mouse, in grid-cell units, plus a smoothed 0..1 presence so the
            // effect fades in/out instead of snapping when the cursor enters/leaves
            var mouseGX = -9999, mouseGY = -9999;
            var influence = 0, targetInfluence = 0;
            var swirlRadius = 15;   // reach of the vortex, in grid cells
            var swirlAmount = 1.6;  // max rotation applied at the cursor, in radians

            function measureChar() {
                var r = probe.getBoundingClientRect();
                return { w: r.width, h: r.height || 13 };
            }

            function buildMask(cols, rows) {
                var data = new Float32Array(cols * rows);

                var TEXT = 'BACKBEAT';
                var textCols = Math.max(10, Math.round(cols * 0.86));
                var samplePerCol = 10; // px per column at sampling resolution

                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d');

                var probeSize = 400;
                ctx.font = "700 " + probeSize + "px 'Tusker', sans-serif";
                var probeWidth = ctx.measureText(TEXT).width;
                var targetWidthPx = textCols * samplePerCol;
                var fontSize = probeSize * (targetWidthPx / probeWidth);

                ctx.font = "700 " + fontSize + "px 'Tusker', sans-serif";
                var metrics = ctx.measureText(TEXT);
                var textWidth = metrics.width;
                var ascent = metrics.actualBoundingBoxAscent || fontSize * 0.75;
                var descent = metrics.actualBoundingBoxDescent || fontSize * 0.2;
                var textHeight = ascent + descent;

                var padX = textWidth * 0.04;
                var padY = textHeight * 0.3;

                canvas.width = Math.ceil(textWidth + padX * 2);
                canvas.height = Math.ceil(textHeight + padY * 2);

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = "700 " + fontSize + "px 'Tusker', sans-serif";
                ctx.fillStyle = '#fff';
                ctx.textBaseline = 'alphabetic';
                ctx.fillText(TEXT, padX, padY + ascent);

                var cellW = canvas.width / textCols;
                var cellH = cellW / CHAR_ASPECT;
                var textRows = Math.max(1, Math.round(canvas.height / cellH));

                var img = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

                var colOffset = Math.round((cols - textCols) / 2);
                var rowOffset = Math.round((rows - textRows) / 2);

                for (var r = 0; r < textRows; r++) {
                    var y0 = Math.floor(r * cellH), y1 = Math.floor((r + 1) * cellH);
                    var destRow = rowOffset + r;
                    if (destRow < 0 || destRow >= rows) continue;
                    for (var c = 0; c < textCols; c++) {
                        var x0 = Math.floor(c * cellW), x1 = Math.floor((c + 1) * cellW);
                        var destCol = colOffset + c;
                        if (destCol < 0 || destCol >= cols) continue;

                        var sum = 0, count = 0;
                        for (var y = y0; y < y1 && y < canvas.height; y += 2) {
                            var rowBase = y * canvas.width;
                            for (var x = x0; x < x1 && x < canvas.width; x += 2) {
                                sum += img[(rowBase + x) * 4];
                                count++;
                            }
                        }
                        var avg = count ? sum / count / 255 : 0;
                        data[destRow * cols + destCol] = avg;
                    }
                }

                return data;
            }

            function build() {
                var char = measureChar();
                charW = char.w;
                charH = char.h;
                cols = Math.max(1, Math.ceil(window.innerWidth / char.w) + 1);
                rows = Math.max(1, Math.ceil(window.innerHeight / char.h) + 1);
                cx = cols / 2;
                cy = rows / 2;
                mask = buildMask(cols, rows);
            }

            function fieldValue(x, y, t) {
                // plain (unfolded) coordinates so the flow travels linearly across the
                // whole field instead of mirroring into quadrants around the center
                var fx = x - cx;
                var fy = (y - cy) * 1.9; // compensate for character cells being taller than wide

                // domain-warp the coordinates before sampling, for an organic flowing look
                var wx = fx + Math.sin(fy * 0.05 + t * W * 1) * 7;
                var wy = fy + Math.cos(fx * 0.05 + t * W * 1) * 7;

                // the cursor stirs the field like a paddle in water: nearby cells get
                // rotated around the pointer (a vortex) plus a ring of ripples that
                // travel outward, both fading with distance and with hover presence
                if (influence > 0.002) {
                    var dxm = x - mouseGX;
                    var dym = (y - mouseGY) * 1.9;
                    var distm = Math.sqrt(dxm * dxm + dym * dym);
                    var reach = influence * Math.exp(-distm / swirlRadius);

                    if (reach > 0.002) {
                        var angle = reach * swirlAmount;
                        var cosA = Math.cos(angle), sinA = Math.sin(angle);
                        var rx = dxm * cosA - dym * sinA;
                        var ry = dxm * sinA + dym * cosA;
                        wx += rx - dxm;
                        wy += (ry - dym);

                        wx += reach * Math.sin(distm * 0.5 - t * W * 6) * 4;
                        wy += reach * Math.cos(distm * 0.5 - t * W * 6) * 4;
                    }
                }

                var n = Math.sin(wx * 0.09 + t * W * 2) * Math.cos(wy * 0.07 - t * W * 3)
                      + Math.sin((wx + wy) * 0.05 + t * W * 1) * 0.6
                      + Math.sin(wx * 0.03 + wy * 0.06 - t * W * 2) * 0.5;

                return Math.min(1, Math.max(0, (n / 2.1 + 1) / 2)); // normalized 0..1
            }

            function frame(ts) {
                var t = ts / 1000;
                influence += (targetInfluence - influence) * 0.08;
                var lines = new Array(rows);
                for (var y = 0; y < rows; y++) {
                    var line = '';
                    var rowBase = y * cols;
                    for (var x = 0; x < cols; x++) {
                        var fd = fieldValue(x, y, t);
                        var td = mask[rowBase + x];

                        // letters stay legible (density never drops below half) but still
                        // shimmer with the flow; the background is a sparser, dimmer echo
                        // of the same field so the wordmark reads as "made of" the pattern
                        var d = td * (0.5 + 0.5 * fd) + (1 - td) * fd * 0.5;

                        line += RAMP[Math.floor(d * (RAMP.length - 1))];
                    }
                    lines[y] = line;
                }
                el.textContent = lines.join('\n');
                requestAnimationFrame(frame);
            }

            window.addEventListener('mousemove', function (e) {
                mouseGX = e.clientX / charW;
                mouseGY = e.clientY / charH;
                targetInfluence = 1;
            });

            window.addEventListener('mouseleave', function () {
                targetInfluence = 0;
            });

            window.addEventListener('touchmove', function (e) {
                var touch = e.touches[0];
                mouseGX = touch.clientX / charW;
                mouseGY = touch.clientY / charH;
                targetInfluence = 1;
            }, { passive: true });

            window.addEventListener('touchend', function () {
                targetInfluence = 0;
            });

            // wait for the Tusker face to actually be ready before rasterizing the
            // wordmark, otherwise the canvas would silently fall back to a system font
            document.fonts.load("700 400px Tusker").catch(function () {}).then(function () {
                build();
                requestAnimationFrame(frame);
            });

            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(build, 200);
            });
        })();
    </script>

</body>
</html>
