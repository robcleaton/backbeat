
<body>
  <!-- Theme switcher -->
  <input type="checkbox" class="theme-switch" id="theme-switch" />
  <div id="page">

    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <div class="brand-title">
            <button class="navbar-toggler me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
              <i class="bi bi-list"></i>
            </button>
            <a class="navbar-brand" href="/example">{{ site.title }}</a>
          </div>
          <!-- Theme switcher -->
          <label for="theme-switch" class="switch-label bi bi-moon-fill">
          </label>
        </div>
      </nav>
      <!-- Mobile menu -->
      <div class="mobile-menu">
        <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
          <div class="offcanvas-header">
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>
          <div class="offcanvas-body">
            <div class="menu-mobile">
              {% include menu.html %}
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="menu-desktop">
      {% include menu.html %}
    </div>
