<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pivot | Backbeat</title>
    <meta name="google-site-verification" content="dt83dwPy2H1I4QQd49_-VSn3PJOR8wYIVwQW7YBA-Gw" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
    <link href="/assets/css/site.css" rel="stylesheet">

    <style>
        .pivot-tile {
            position: relative;
            width: 100%;
            height: calc(100svh - (var(--gutter) * 2));
            border-radius: 1.5rem;
            overflow: hidden;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pivot-word {
            display: flex;
            align-items: baseline;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-weight: 800;
            font-size: clamp(4rem, 16vw, 12rem);
            line-height: 0.85;
            letter-spacing: -0.02em;
            color: #ffffff;
            user-select: none;
            opacity: 0;
        }

        .pivot-b, .pivot-back-b {
            display: inline-block;
        }
        .pivot-back-b {
            transition: transform 1.3s ease-in-out;
        }

        .pivot-ack-mask, .pivot-beat-mask {
            display: inline-flex;
            overflow: hidden;
        }
        .pivot-ack-slide, .pivot-beat-slide {
            display: inline-flex;
            transition: transform 1.3s ease-in-out;
        }

        .back-link {
            position: absolute;
            top: calc(var(--gutter) + 1.25rem);
            left: calc(var(--gutter) + 1.25rem);
            z-index: 2;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
        }
        .back-link:hover { color: #ffffff; }
    </style>
</head>
<body>

    <div class="pivot-tile">
        <a href="/" class="back-link">&larr; Backbeat.systems</a>
        <div class="pivot-word" id="pivotWord">
            <span class="pivot-back-b" id="backB">B</span><div class="pivot-ack-mask"><div class="pivot-ack-slide" id="ackSlide">ACK</div></div><span class="pivot-b" id="centralB">B</span><div class="pivot-beat-mask"><div class="pivot-beat-slide" id="beatSlide">EAT</div></div>
        </div>
    </div>

    <script>
        const pivotWord = document.getElementById('pivotWord');
        const backB = document.getElementById('backB');
        const centralB = document.getElementById('centralB');
        const ackSlide = document.getElementById('ackSlide');
        const beatSlide = document.getElementById('beatSlide');

        function run() {
            // Jump to the hidden state instantly (no transition) so we can measure it.
            [backB, ackSlide, beatSlide].forEach(el => el.style.transition = 'none');
            backB.style.transform = 'translateX(0)';
            ackSlide.style.transform = 'translateX(0)';
            beatSlide.style.transform = 'translateX(0)';

            // backB starts exactly on top of centralB, so it reads as "the same B".
            // ackSlide uses the SAME shift (not its own width) so it moves in lockstep
            // with backB, keeping a constant B-to-A distance throughout the transition.
            const shift = centralB.getBoundingClientRect().left - backB.getBoundingClientRect().left;
            backB.style.transform = `translateX(${shift}px)`;
            ackSlide.style.transform = `translateX(${shift}px)`;
            beatSlide.style.transform = 'translateX(-100%)';

            // Flush the hidden state to the render tree before revealing/animating.
            void pivotWord.offsetWidth;
            pivotWord.style.opacity = '1';
            [backB, ackSlide, beatSlide].forEach(el => el.style.transition = '');

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    backB.style.transform = 'translateX(0)';
                    ackSlide.style.transform = 'translateX(0)';
                    beatSlide.style.transform = 'translateX(0)';
                });
            });
        }

        window.addEventListener('load', run);
    </script>

</body>
</html>
