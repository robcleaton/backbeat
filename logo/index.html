<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo | Backbeat</title>
    <meta name="google-site-verification" content="dt83dwPy2H1I4QQd49_-VSn3PJOR8wYIVwQW7YBA-Gw" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
    <link href="/assets/css/site.css" rel="stylesheet">

    <style>
        .logo-tile {
            position: relative;
            width: 100%;
            height: calc(100svh - (var(--gutter) * 2));
            border-radius: 1.5rem;
            overflow: hidden;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes letter-wave-plus {
            0%, 100% {
                font-variation-settings: 'wght' 800, 'wdth' 100, 'opsz' 96;
                transform: scale(1) translateY(0);
                color: #ffffff;
            }
            50% {
                font-variation-settings: 'wght' 200, 'wdth' 75, 'opsz' 12;
                transform: scale(0.8) translateY(0.1em);
                color: #d72929;
            }
        }
        .letter-anim-plus {
            display: inline-block;
            animation: letter-wave-plus 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }

        .logo-heading {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: clamp(5.2rem, 24vw, 16rem);
            line-height: 0.85;
            letter-spacing: -0.04em;
            text-align: center;
            user-select: none;
        }

        .back-link {
            position: absolute;
            top: calc(var(--gutter) + 1.25rem);
            left: calc(var(--gutter) + 1.25rem);
            z-index: 2;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
        }
        .back-link:hover { color: #ffffff; }
    </style>
</head>
<body>

    <div class="logo-tile">
        <a href="/" class="back-link">&larr; Backbeat.systems</a>
        <h1 class="logo-heading">
            <span class="letter-anim-plus" style="animation-delay:0s">B</span><span class="letter-anim-plus" style="animation-delay:-0.3s">A</span><span class="letter-anim-plus" style="animation-delay:-0.6s">C</span><span class="letter-anim-plus" style="animation-delay:-0.9s">K</span><span class="letter-anim-plus" style="animation-delay:-1.2s">B</span><span class="letter-anim-plus" style="animation-delay:-1.5s">E</span><span class="letter-anim-plus" style="animation-delay:-1.8s">A</span><span class="letter-anim-plus" style="animation-delay:-2.1s">T</span>
        </h1>
    </div>

</body>
</html>
