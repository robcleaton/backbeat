<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backbeat.systems — Glyph Field / Animated Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'SFMono';
            src: url('/Users/robcleaton/Library/Fonts/SF-Mono-Semibold.otf') format('opentype');
            font-weight: 600;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        * { -webkit-font-smoothing: antialiased; }

        html, body { height: 100%; }

        body {
            background: #000000;
            min-height: 100svh;
            overflow: hidden;
        }

        #field {
            position: fixed;
            inset: 0;
            z-index: 0;
            font-family: 'SFMono', ui-monospace, Menlo, monospace;
            font-weight: 600;
            font-size: 13px;
            line-height: 1;
            letter-spacing: 0;
            white-space: pre;
            color: rgba(255,255,255,0.4);
            user-select: none;
            overflow: hidden;
        }

        #probe {
            position: absolute;
            visibility: hidden;
            white-space: pre;
            font-family: 'SFMono', ui-monospace, Menlo, monospace;
            font-weight: 600;
            font-size: 13px;
            line-height: 1;
        }

        /* ── animated centerpiece, ported from the homepage ── */
        .hero-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            font-family: 'Bricolage Grotesque', sans-serif;
            color: #fff;
        }

        @keyframes letter-wave {
            0%, 100% { font-variation-settings: 'wght' 800, 'wdth' 100, 'opsz' 96; }
            50%       { font-variation-settings: 'wght' 200, 'wdth' 75,  'opsz' 12; }
        }
        .letter-anim {
            display: inline-block;
            animation: letter-wave 6s ease-in-out infinite;
        }

        .hero-overlay h1 {
            font-size: clamp(5.2rem, 21vw, 13rem);
            line-height: 0.85;
            letter-spacing: -0.04em;
            text-align: center;
            user-select: none;
            text-shadow: 0 4px 50px rgba(0,0,0,0.35);
        }

        .hero-overlay .suffix {
            font-size: clamp(2.2rem, 2.2vw, 4.5rem);
            font-variation-settings: 'wght' 300, 'wdth' 75, 'opsz' 12;
            letter-spacing: 6px;
            margin-top: 0.15em;
            text-transform: uppercase;
            user-select: none;
            text-align: center;
            line-height: 90%;
            margin-bottom: 1rem;
        }

        .hero-overlay .suffix-sm {
            font-size: clamp(1.6rem, 1.6vw, 3.2rem);
            font-variation-settings: 'wght' 200, 'wdth' 75, 'opsz' 12;
            letter-spacing: 0.4em;
            word-spacing: 0.4em;
            text-transform: uppercase;
            user-select: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <pre id="field"></pre>
    <span id="probe">0</span>

    <div class="hero-overlay">
        <h1>
            <span class="letter-anim" style="animation-delay:0s">B</span><span class="letter-anim" style="animation-delay:-0.75s">A</span><span class="letter-anim" style="animation-delay:-1.5s">C</span><span class="letter-anim" style="animation-delay:-2.25s">K</span><span class="letter-anim" style="animation-delay:-3s">B</span><span class="letter-anim" style="animation-delay:-3.75s">E</span><span class="letter-anim" style="animation-delay:-4.5s">A</span><span class="letter-anim" style="animation-delay:-5.25s">T</span>
        </h1>
        <div class="suffix">Design Systems Consultancy</div>
        <div class="suffix-sm">Rhythm in the System</div>
    </div>

    <script>
        (function () {
            var el = document.getElementById('field');
            var probe = document.getElementById('probe');
            var RAMP = ' .:-=+*#%@';
            var LOOP_SECONDS = 22; // the whole ambient field tiles perfectly back to its start every N seconds
            var W = (Math.PI * 2) / LOOP_SECONDS;

            var cols = 0, rows = 0, cx = 0, cy = 0;
            var charW = 8, charH = 13;
            var resizeTimer = null;

            // mouse, in grid-cell units, plus a smoothed 0..1 presence so the
            // effect fades in/out instead of snapping when the cursor enters/leaves
            var mouseGX = -9999, mouseGY = -9999;
            var influence = 0, targetInfluence = 0;
            var swirlRadius = 15;   // reach of the vortex, in grid cells
            var swirlAmount = 1.6;  // max rotation applied at the cursor, in radians

            function measureChar() {
                var r = probe.getBoundingClientRect();
                return { w: r.width, h: r.height || 13 };
            }

            function build() {
                var char = measureChar();
                charW = char.w;
                charH = char.h;
                cols = Math.max(1, Math.ceil(window.innerWidth / char.w) + 1);
                rows = Math.max(1, Math.ceil(window.innerHeight / char.h) + 1);
                cx = cols / 2;
                cy = rows / 2;
            }

            function fieldValue(x, y, t) {
                // plain (unfolded) coordinates so the flow travels linearly across the
                // whole field instead of mirroring into quadrants around the center
                var fx = x - cx;
                var fy = (y - cy) * 1.9; // compensate for character cells being taller than wide

                // domain-warp the coordinates before sampling, for an organic flowing look
                var wx = fx + Math.sin(fy * 0.05 + t * W * 1) * 7;
                var wy = fy + Math.cos(fx * 0.05 + t * W * 1) * 7;

                // the cursor stirs the field like a paddle in water: nearby cells get
                // rotated around the pointer (a vortex) plus a ring of ripples that
                // travel outward, both fading with distance and with hover presence
                if (influence > 0.002) {
                    var dxm = x - mouseGX;
                    var dym = (y - mouseGY) * 1.9;
                    var distm = Math.sqrt(dxm * dxm + dym * dym);
                    var reach = influence * Math.exp(-distm / swirlRadius);

                    if (reach > 0.002) {
                        var angle = reach * swirlAmount;
                        var cosA = Math.cos(angle), sinA = Math.sin(angle);
                        var rx = dxm * cosA - dym * sinA;
                        var ry = dxm * sinA + dym * cosA;
                        wx += rx - dxm;
                        wy += (ry - dym);

                        wx += reach * Math.sin(distm * 0.5 - t * W * 6) * 4;
                        wy += reach * Math.cos(distm * 0.5 - t * W * 6) * 4;
                    }
                }

                var n = Math.sin(wx * 0.09 + t * W * 2) * Math.cos(wy * 0.07 - t * W * 3)
                      + Math.sin((wx + wy) * 0.05 + t * W * 1) * 0.6
                      + Math.sin(wx * 0.03 + wy * 0.06 - t * W * 2) * 0.5;

                return Math.min(1, Math.max(0, (n / 2.1 + 1) / 2)); // normalized 0..1
            }

            function frame(ts) {
                var t = ts / 1000;
                influence += (targetInfluence - influence) * 0.08;
                var lines = new Array(rows);
                for (var y = 0; y < rows; y++) {
                    var line = '';
                    for (var x = 0; x < cols; x++) {
                        var d = fieldValue(x, y, t);
                        line += RAMP[Math.floor(d * (RAMP.length - 1))];
                    }
                    lines[y] = line;
                }
                el.textContent = lines.join('\n');
                requestAnimationFrame(frame);
            }

            window.addEventListener('mousemove', function (e) {
                mouseGX = e.clientX / charW;
                mouseGY = e.clientY / charH;
                targetInfluence = 1;
            });

            window.addEventListener('mouseleave', function () {
                targetInfluence = 0;
            });

            window.addEventListener('touchmove', function (e) {
                var touch = e.touches[0];
                mouseGX = touch.clientX / charW;
                mouseGY = touch.clientY / charH;
                targetInfluence = 1;
            }, { passive: true });

            window.addEventListener('touchend', function () {
                targetInfluence = 0;
            });

            build();
            requestAnimationFrame(frame);

            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(build, 200);
            });
        })();
    </script>

</body>
</html>
