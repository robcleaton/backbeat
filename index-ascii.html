<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backbeat.systems — Design Systems Consultancy (ASCII alt)</title>
    <style>
        @font-face {
            font-family: 'SFMono';
            src: url('/Users/robcleaton/Library/Fonts/SF-Mono-Regular.otf') format('opentype');
            font-weight: 400;
        }
        @font-face {
            font-family: 'SFMono';
            src: url('/Users/robcleaton/Library/Fonts/SF-Mono-Semibold.otf') format('opentype');
            font-weight: 600;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        * { -webkit-font-smoothing: antialiased; }

        html, body { height: 100%; }

        body {
            font-family: 'SFMono', ui-monospace, Menlo, monospace;
            background-color: #060607;
            color: #fff;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* moving scanline overlay for a CRT / terminal feel */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.035) 0px,
                rgba(255,255,255,0.035) 1px,
                transparent 1px,
                transparent 3px
            );
            background-size: 100% 6px;
            animation: scan-move 8s linear infinite;
            z-index: 2;
            mix-blend-mode: overlay;
        }

        @keyframes scan-move {
            0%   { background-position: 0 0; }
            100% { background-position: 0 240px; }
        }

        @keyframes ascii-color-cycle {
            0%   { color: #FF3B5C; }
            16%  { color: #FF8A3D; }
            33%  { color: #FFD600; }
            50%  { color: #3DDC84; }
            66%  { color: #4E8CFF; }
            83%  { color: #C34EFF; }
            100% { color: #FF3B5C; }
        }

        .ascii-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 1rem;
        }

        #ascii-art {
            font-family: 'SFMono', ui-monospace, Menlo, monospace;
            font-weight: 600;
            white-space: pre;
            line-height: 1.12;
            letter-spacing: 0;
            text-align: center;
            user-select: none;
            animation: ascii-color-cycle 24s ease-in-out infinite;
            text-shadow: 0 0 14px currentColor;
        }

        .suffix {
            font-size: clamp(0.8rem, 2vw, 1.15rem);
            color: rgba(255,255,255,0.55);
            letter-spacing: 0.02em;
            margin-top: 1.4rem;
            text-align: center;
        }

        .suffix-sm {
            font-size: clamp(0.7rem, 1.6vw, 0.95rem);
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.02em;
            margin-top: 0.35rem;
            text-align: center;
        }

        .prompt::before {
            content: '> ';
            opacity: 0.6;
        }

        .cursor {
            display: inline-block;
            width: 0.55em;
            height: 1em;
            background: rgba(255,255,255,0.55);
            margin-left: 0.3em;
            vertical-align: text-bottom;
            animation: blink 1s steps(1) infinite;
        }

        @keyframes blink {
            0%, 49%  { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="ascii-wrap">
        <pre id="ascii-art"></pre>
    </div>
    <div class="suffix prompt">Design Systems Consultancy</div>
    <div class="suffix-sm prompt">Rhythm in the System<span class="cursor"></span></div>

    <script>
        (function () {
            var TEXT = 'BACKBEAT';
            var RAMP = ' .:-=+*#%@';
            var CHAR_ASPECT = 0.56; // approx monospace glyph width / height
            var el = document.getElementById('ascii-art');
            var baseGrid = null; // { cols, rows, cells: Uint8Array of ramp indices }
            var jitterTimer = null;
            var resizeTimer = null;

            function pickCols() {
                var w = window.innerWidth;
                return Math.max(40, Math.min(120, Math.floor(w / 9)));
            }

            function buildGrid(cols) {
                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d');

                var sampleW = 10; // px per column at full sampling resolution
                var probeSize = 400;
                ctx.font = "900 " + probeSize + "px 'Arial Black', sans-serif";
                var probeWidth = ctx.measureText(TEXT).width;
                var targetWidthPx = cols * sampleW;
                var fontSize = probeSize * (targetWidthPx / probeWidth);

                ctx.font = "900 " + fontSize + "px 'Arial Black', sans-serif";
                var metrics = ctx.measureText(TEXT);
                var textWidth = metrics.width;
                var ascent = metrics.actualBoundingBoxAscent || fontSize * 0.75;
                var descent = metrics.actualBoundingBoxDescent || fontSize * 0.2;
                var textHeight = ascent + descent;

                var padX = textWidth * 0.05;
                var padY = textHeight * 0.4;

                canvas.width = Math.ceil(textWidth + padX * 2);
                canvas.height = Math.ceil(textHeight + padY * 2);

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = "900 " + fontSize + "px 'Arial Black', sans-serif";
                ctx.fillStyle = '#fff';
                ctx.textBaseline = 'alphabetic';
                ctx.fillText(TEXT, padX, padY + ascent);

                var cellW = canvas.width / cols;
                var cellH = cellW / CHAR_ASPECT;
                var rows = Math.max(1, Math.round(canvas.height / cellH));

                var data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                var cells = new Uint8Array(cols * rows);

                for (var r = 0; r < rows; r++) {
                    var y0 = Math.floor(r * cellH), y1 = Math.floor((r + 1) * cellH);
                    for (var c = 0; c < cols; c++) {
                        var x0 = Math.floor(c * cellW), x1 = Math.floor((c + 1) * cellW);
                        var sum = 0, count = 0;
                        for (var y = y0; y < y1 && y < canvas.height; y += 2) {
                            var rowBase = y * canvas.width;
                            for (var x = x0; x < x1 && x < canvas.width; x += 2) {
                                sum += data[(rowBase + x) * 4];
                                count++;
                            }
                        }
                        var avg = count ? sum / count : 0;
                        var idx = Math.min(RAMP.length - 1, Math.floor((avg / 255) * RAMP.length));
                        cells[r * cols + c] = idx;
                    }
                }

                return { cols: cols, rows: rows, cells: cells };
            }

            function render(grid, jitterCells) {
                var lines = [];
                for (var r = 0; r < grid.rows; r++) {
                    var line = '';
                    for (var c = 0; c < grid.cols; c++) {
                        var i = r * grid.cols + c;
                        var idx = grid.cells[i];
                        if (jitterCells && jitterCells.has(i) && idx > 0) {
                            var delta = Math.random() < 0.5 ? -1 : 1;
                            idx = Math.max(1, Math.min(RAMP.length - 1, idx + delta));
                        }
                        line += RAMP[idx];
                    }
                    lines.push(line);
                }
                el.textContent = lines.join('\n');
            }

            function startJitter() {
                if (jitterTimer) clearInterval(jitterTimer);
                jitterTimer = setInterval(function () {
                    if (!baseGrid) return;
                    var total = baseGrid.cols * baseGrid.rows;
                    var jitterCount = Math.floor(total * 0.035);
                    var jitterCells = new Set();
                    for (var i = 0; i < jitterCount; i++) {
                        jitterCells.add(Math.floor(Math.random() * total));
                    }
                    render(baseGrid, jitterCells);
                }, 110);
            }

            function rebuild() {
                baseGrid = buildGrid(pickCols());
                render(baseGrid, null);
            }

            rebuild();
            startJitter();

            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(rebuild, 200);
            });
        })();
    </script>

</body>
</html>
