<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backbeat.systems — Design Systems Consultancy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        * { -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Bricolage Grotesque', sans-serif;
            background-color: #0B0B0B;
            color: #fff;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        @keyframes letter-wave {
            0%, 100% { font-variation-settings: 'wght' 800, 'wdth' 100, 'opsz' 96; }
            50%       { font-variation-settings: 'wght' 200, 'wdth' 75,  'opsz' 12; }
        }

        .letter-anim {
            display: inline-block;
            animation: letter-wave 6s ease-in-out infinite;
        }

        h1 {
            font-size: clamp(3.5rem, 22vw, 18rem);
            line-height: 0.85;
            letter-spacing: -0.04em;
            text-align: center;
            user-select: none;
        }

        .suffix {
            font-size: clamp(1rem, 5.5vw, 4.5rem);
            font-variation-settings: 'wght' 200, 'wdth' 75, 'opsz' 12;
            color: rgba(255,255,255,0.18);
            letter-spacing: -0.03em;
            margin-top: 0.15em;
        }
    </style>
</head>
<body>

    <h1>
        <span class="letter-anim" style="animation-delay:0s">B</span><span
            class="letter-anim" style="animation-delay:-0.75s">A</span><span
            class="letter-anim" style="animation-delay:-1.5s">C</span><span
            class="letter-anim" style="animation-delay:-2.25s">K</span><br>
        <span class="letter-anim" style="animation-delay:-3s">B</span><span
            class="letter-anim" style="animation-delay:-3.75s">E</span><span
            class="letter-anim" style="animation-delay:-4.5s">A</span><span
            class="letter-anim" style="animation-delay:-5.25s">T</span>
    </h1>
    <div class="suffix">.systems</div>

</body>
</html>
